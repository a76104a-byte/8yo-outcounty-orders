<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>八曜和茶外縣市訂單｜測試版</title><style>body{font:16px system-ui,sans-serif;background:#f4f6f2;color:#20372c;margin:0}header{background:#244e38;color:white;padding:24px 16px}main{max-width:780px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px #0001}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #c7d1c7;border-radius:8px;background:white}button{background:#24533b;color:white;border:0;margin-top:10px;cursor:pointer}.warn{background:#fff1ce;padding:12px;border-radius:8px}.item{display:grid;grid-template-columns:1fr 88px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.muted{color:#667}.hide{display:none}small{color:#667}</style></head><body><header><h2 id="heading">八曜和茶外縣市訂單</h2><div>菜單與地址連動測試版</div></header><main><section class="warn"><strong>僅供測試，尚未開放正式下單。</strong> 本頁不會將資料送往門市，也不會上傳客人資料。請使用測試資料。</section><section><label>測試門市</label><select id="store"><option value="斗六">斗六門市</option><option value="員林">員林門市</option></select><label>訂購日期</label><input id="date" type="date"><label>姓名</label><input id="customer" placeholder="測試姓名"><label>聯絡電話</label><input id="phone" inputmode="tel" placeholder="測試電話"><label>縣市</label><select id="city"><option value="">請選擇縣市</option></select><label>鄉鎮市區</label><select id="district"><option value="">請先選縣市</option></select><label>詳細地址</label><input id="address" placeholder="路、街、號、樓層"><small id="districtStatus">請先選縣市</small></section><section><h3>OCARD 會員與發票</h3><label>會員點數</label><select id="ocard"><option value="no">不需入點</option><option value="yes">需要入點（門市人工處理）</option></select><div id="memberFields" class="hide"><label>OCARD 會員電話</label><input id="memberPhone" inputmode="tel"></div><label>需要統一編號嗎？</label><selec const menus={"和風茶":[["八曜和茶",35],["和風308",50],["83蜂凝露",55]],"複方茶":[["和風307",50],["究極308",42],["朝日覺醒紅茶",40],["83蜂見茶",60]],"自然茶":[["極上307",37],["舞伎406紅茶",46],["大地覺醒紅茶",35],["明日清爽茶",35],["焙煎黑烏龍",35],["茉妃505",40]],"纖果爽":[["柚香覺醒307",67],["柚香覺醒紅茶",65],["八曜雙C檸檬露",50],["享夏307",60],["明日清爽檸檬茶",55],["京楓檸檬紅茶",50],["八曜黑檸檬茶",55],["83蜂檸爽",65]],"極韻白":[["8YO極韻白奶茶",79],["308極韻白奶茶",79],["307極韻白奶茶",89],["406極韻白奶茶",89],["茉心極韻白奶茶",89]],"厚奶茶":[["覺醒奶茶",55],["匠心奶茶",60],["深焙黑龍奶茶",55],["京彩舞伎奶茶",66],["冬煎奶茶",66],["308焙煎濃乳",66],["83蜂潮奶茶",69],["雪匠奶茶",69],["茉妃雪奶",60]],"鮮乳定製":[["八曜和風（茶乳）",55],["八曜和風（乳茶）",65],["牧場覺醒（茶乳）",55],["牧場覺醒（乳茶）",65],["牧場黑烏龍（茶乳）",60],["牧場黑烏龍（乳茶）",70],["牧場307（茶乳）",65],["牧場307（乳茶）",75],["牧場308（茶乳）",65],["牧場308（乳茶）",75],["茉妃505（茶乳）",65],["茉妃505（乳茶）",75]],"乳酸樂多":[["樂多307",70],["樂多308",70],["八曜樂多",60],["明日樂多",60],["茉語樂多",70]],"ㄦㄦ益生菌":[["激酵ㄦㄦ",79],["順解ㄦㄦ",79]],"季節限定":[["406極韻花生白奶茶",99],["308極韻花生白奶茶",99],["505極韻花生白奶茶",99]]};
const $=id=>document.getElementById(id),cart={};
function opt(v,t){const o=document.createElement("option");o.value=v;o.textContent=t;return o}
Object.keys(area).forEach(c=>$("city").appendChild(opt(c,c)));
function districts(){const city=$("city").value;const d=$("district");d.replaceChildren(opt("",city?"請選擇鄉鎮市區":"請先選縣市"));if(city)area[city].split(" ").forEach(n=>d.appendChild(opt(n,n)));$("districtStatus").textContent=city?"已載入 "+(d.options.length-1)+" 個鄉鎮市區":"請先選縣市"}
$("city").addEventListener("change",districts);$("city").addEventListener("input",districts);districts();
$("store").addEventListener("change",()=>{$("heading").textContent="八曜和茶"+$("store").value+"門市外縣市訂單"});
const preset=new URLSearchParams(location.search).get("store");if(preset==="員林"||preset==="斗六"){$("store").value=preset;$("store").disabled=true}$("heading").textContent="八曜和茶"+$("store").value+"門市外縣市訂單";
$("date").value=new Date().toLocaleDateString("sv-SE");
Object.keys(menus).forEach(k=>$("category").appendChild(opt(k,k)));
function drawMenu(){$("menu").replaceChildren();menus[$("category").value].forEach(([name,price])=>{const div=document.createElement("div");div.className="item";const label=document.createElement("div");label.textContent=name+"　$"+price;const qty=document.createElement("input");qty.type="number";qty.min=0;qty.max=99;qty.value=cart[name]?.qty||0;qty.setAttribute("aria-label",name+" 數量");qty.addEventListener("change",()=>{const q=Math.max(0,Math.min(99,Number(qty.value)||0));if(q)cart[name]={price,qty:q};else delete cart[name];drawCart()});div.append(label,qty);$("menu").appendChild(div)})}
function drawCart(){const entries=Object.entries(cart);$("cart").textContent=entries.map(([n,v])=>n+" × "+v.qty+" = $"+v.qty*v.price).join("、")||"尚未選擇";$("total").textContent=entries.reduce((s,[n,v])=>s+v.qty,0)+" 杯，$"+entries.reduce((s,[n,v])=>s+v.qty*v.price,0)}
$("category").addEventListener("change",drawMenu);drawMenu();drawCart();
["ocard","invoice"].forEach(id=>$(id).addEventListener("change",()=>$(id==="ocard"?"memberFields":"invoiceFields").classList.toggle("hide",$(id).value!=="yes")));
function loadSaved(){const data=JSON.parse(localStorage.getItem("8yo_test_address")||"[]");$("saved").replaceChildren(opt("","選擇已儲存地址"));data.forEach((r,i)=>$("saved").appendChild(opt(String(i),r.city+r.district+r.address)))}
$("saved").addEventListener("change",()=>{const data=JSON.parse(localStorage.getItem("8yo_test_address")||"[]");const r=data[Number($("saved").value)];if(!r)return;["customer","phone","city","address"].forEach(id=>$(id).value=r[id]);districts();$("district").value=r.district});loadSaved();
$("copy").addEventListener("click",async()=>{if(!$("city").value||!$("district").value){alert("請先選擇縣市與鄉鎮市區");return}if($("save").checked){const data=JSON.parse(localStorage.getItem("8yo_test_address")||"[]");data.push(Object.fromEntries(["customer","phone","city","district","address"].map(id=>[id,$(id).value])));localStorage.setItem("8yo_test_address",JSON.stringify(data));loadSaved()}const t=["【測試訂單｜尚未送達門市】","門市："+$("store").value,"日期："+$("date").value,"客人："+$("customer").value,"電話："+$("phone").value,"地址："+$("city").value+$("district").value+$("address").value,"OCARD："+($("ocard").value==="yes"?"待入點 "+$("memberPhone").value:"不需入點"),"統編："+($("invoice").value==="yes"?$("taxId").value+" "+$("company").value:"不需要"),...Object.entries(cart).map(([n,v])=>n+" ×"+v.qty+" $"+v.price*v.qty),$("total").textContent].join("\n");try{await navigator.clipboard.writeText(t);alert("測試訂單文字已複製；未傳送門市")}catch(e){prompt("請複製以下訂單",t)}});
</script></body></html>
